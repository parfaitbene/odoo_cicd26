services:
  odoo_web:
    image: odoo:18.0
    container_name: odoo_web
    restart: always
    ports:
      - "8069:8069"
      - "8072:8072"
    volumes:
      - odoo-data:/var/lib/odoo
      - ../config:/etc/odoo
      - ../addons/custom:/mnt/extra-addons
    environment:
      - PASSWORD_FILE=/run/secrets/postgresql_password
      - HOST=odoo.lab.local
      - USER=odoo
    secrets:
      - postgresql_password
    
volumes:
  odoo-data:
secrets:
  postgresql_password:
  file: ../odoo_pg_pass